<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0715">
<title>混沌挑战 Boss战</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0715;overflow:hidden;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0b0715}

  #boot,#tip{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:#cfd8f5;background:#0b0715;
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;text-align:center;padding:26px}
  #boot{z-index:3}
  #boot .t{color:#ffec78;font-size:20px;font-weight:700;letter-spacing:2px}
  #boot .d{color:#8ea2d8;font-size:13px}
  #tip{display:none;z-index:4}
  #tip b{color:#ffec78;font-size:19px}
  #tip .d{color:#9fb4e8;font-size:13.5px;max-width:420px}
  #tip a{display:inline-block;color:#cfe0ff;text-decoration:none;border:2px solid #7fa0d0;
    padding:11px 24px;border-radius:10px;font-size:15px;margin-top:4px}
  body.ready #boot{display:none}
  body.bad #boot{display:none}
  body.bad #f{display:none}
  body.bad #tip{display:flex}
</style>
</head>
<body>
<iframe id="f" allow="autoplay; fullscreen; clipboard-write; gamepad"></iframe>

<div id="boot">
  <div class="t">混沌挑战 Boss战</div>
  <div class="d">正在进入云端版…</div>
</div>

<div id="tip">
  <b>云端版没加载出来</b>
  <div class="d">网络被挡了一下，或者浏览器拦了跨站页面。刷新再试；也可以先玩离线版，存档留在这台电脑上。</div>
  <a href="offline.html">玩离线版（存档在本机）</a>
</div>

<script>
(function(){
  var CLOUD = "https://chaos-boss-battle.app.workbuddy.host/?sharecode=7RKWIXSBZX";
  var f = document.getElementById("f");
  var got = false, t0 = Date.now();

  // ---- 把旧域名（github.io）里的老存档搬进云端版，只搬一次
  function packOld(){
    try {
      if (localStorage.getItem("__sj_moved") === "1") return "";
      var pack = {};
      ["sanjiao_profile_v1","sanjiao_room_v1","sanjiao_current_v1","sanjiao_accounts_v1"]
        .forEach(function(k){ var v = localStorage.getItem(k); if (v) pack[k] = v; });
      if (!Object.keys(pack).length) return "";
      return "#imp=" + b64(JSON.stringify(pack));
    } catch(e){ return ""; }
  }
  function b64(s){
    var bytes = new TextEncoder().encode(s), bin = "", i;
    for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  // 每次带一个时间戳，避免浏览器拿缓存的旧入口页（入口只有几 KB）
  function buildSrc(){
    return CLOUD + (CLOUD.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now() + packOld();
  }

  f.src = buildSrc();
  f.addEventListener("load", function(){ try { f.focus(); } catch(e){} });

  // ---- 游戏就绪后撤掉过渡层
  window.addEventListener("message", function(ev){
    var d = ev.data;
    if (!d || d.sj !== "ready") return;
    if (ev.source !== f.contentWindow) return;
    got = true;
    document.body.classList.add("ready");
    try { localStorage.setItem("__sj_moved", "1"); } catch(e){}
  });

  // ---- 兜底：18 秒还没就绪就提示
  setTimeout(function(){
    if (!got && Date.now() - t0 > 17000) document.body.classList.add("bad");
  }, 18000);

  // ---- 从后台切回来时，若那时是加载失败状态，自动重试一次
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && document.body.classList.contains("bad")) {
      document.body.classList.remove("bad");
      got = false; t0 = Date.now();
      f.src = buildSrc();
      setTimeout(function(){ if (!got) document.body.classList.add("bad"); }, 18000);
    }
  });
})();
</script>
</body>
</html>
